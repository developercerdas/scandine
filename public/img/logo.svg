<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="scandineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 8)" filter="url(#subtleShadow)">
    <!-- Base Rounded Square -->
    <rect width="64" height="64" rx="18" fill="url(#scandineGrad)" />
    
    <!-- Outer QR Target Corners -->
    <!-- Top-Left Corner -->
    <path d="M16 26 V18 H24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Top-Right Corner -->
    <path d="M48 26 V18 H40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom-Left Corner -->
    <path d="M16 38 V46 H24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom-Right Corner -->
    <path d="M48 38 V46 H40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Dining Fork & Knife / Cloche Motif in Warm Gold -->
    <!-- Center Cloche / Food Bell -->
    <path d="M22 36 C22 27 42 27 42 36 Z" fill="url(#accentGrad)" />
    <circle cx="32" cy="27" r="2.5" fill="#ffffff" />
    <path d="M20 37 H44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- QR Data Matrix Dots below -->
    <rect x="25" y="41" width="4" height="4" rx="1" fill="#ffffff" />
    <rect x="35" y="41" width="4" height="4" rx="1" fill="#ffffff" />
  </g>

  <!-- Typography: ScanDine -->
  <text x="88" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-1">
    <tspan fill="#0f172a">Scan</tspan><tspan fill="#0284c7">Dine</tspan>
  </text>
  
  <!-- Accent Sparkle / Dot over Dine -->
  <circle cx="218" cy="28" r="3.5" fill="#f59e0b" />

  <!-- Subtitle Tagline -->
  <text x="90" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10" fill="#64748b" letter-spacing="2.2">
    SMART QR DINE-IN &amp; POS
  </text>
</svg>
