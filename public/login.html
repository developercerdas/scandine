<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ScanDine | Login Privasi Gerai & Backoffice</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo-icon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 50%, #f1f5f9 100%);
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .login-box {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px rgba(15, 23, 42, 0.05);
      padding: 32px 28px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-logo-img {
      height: 52px;
      display: block;
      margin: 0 auto 12px;
    }

    .login-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.4px;
    }

    .login-subtitle {
      font-size: 0.84rem;
      color: #64748b;
      margin-top: 4px;
      font-weight: 500;
    }

    .login-form-group {
      margin-bottom: 16px;
    }

    .login-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    .login-input {
      width: 100%;
      padding: 12px 16px;
      min-height: 48px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }

    .login-input:focus {
      background: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
    }

    .login-btn {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 14px;
      min-height: 48px;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      margin-top: 20px;
      box-shadow: 0 6px 16px -2px rgba(2, 132, 199, 0.35);
      touch-action: manipulation;
    }

    .login-btn:hover {
      background: #0369a1;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -2px rgba(2, 132, 199, 0.45);
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .error-msg {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }

    .demo-accounts {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px dashed #e2e8f0;
    }

    .demo-title {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #64748b;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .demo-pill {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 12px;
      color: #1e293b;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      transition: all 0.15s;
      touch-action: manipulation;
      text-align: left;
    }

    .demo-pill:hover {
      background: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
      transform: translateY(-1px);
    }

    .demo-role-badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .role-owner {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    .role-branch {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }

    /* ======================================================= */
    /* CUSTOM POWERED-BY FOOTER CARD (CV. ISTANA BARCODE)     */
    /* ======================================================= */
    .powered-card {
      margin-top: 20px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 14px 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform 0.2s;
    }

    .powered-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .pc-icon-box {
      width: 48px;
      height: 48px;
      background: #fffbeb;
      border: 1.5px solid #fde68a;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: inset 0 1px 2px rgba(245, 158, 11, 0.1);
    }

    .pc-content {
      flex: 1;
      min-width: 0;
    }

    .pc-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
      flex-wrap: wrap;
    }

    .pc-powered-label {
      font-size: 0.68rem;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .pc-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      color: #0284c7;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .pc-company {
      font-size: 0.96rem;
      font-weight: 900;
      color: #3b1d07;
      letter-spacing: -0.3px;
      line-height: 1.25;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    .pc-tags {
      font-size: 0.72rem;
      color: #64748b;
      font-weight: 600;
      margin-top: 3px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .pc-dot {
      color: #f59e0b;
      font-weight: 900;
      font-size: 0.8rem;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      transition: color 0.15s;
    }

    .back-home:hover {
      color: #0284c7;
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <!-- Login Box -->
  <div class="login-box">
    <div class="login-brand">
      <img src="/img/logo.svg" alt="ScanDine Logo" class="login-logo-img">
      <h1 class="login-title">ScanDine Merchant</h1>
      <p class="login-subtitle">Akses Login Privasi Gerai & Backoffice</p>
    </div>

    <div class="error-msg" id="login-error"></div>

    <form onsubmit="handleLogin(event)">
      <div class="login-form-group">
        <label class="login-label">Username</label>
        <input type="text" id="username" class="login-input" placeholder="Masukkan username gerai / owner" required autofocus autocomplete="username">
      </div>

      <div class="login-form-group">
        <label class="login-label">Password</label>
        <input type="password" id="password" class="login-input" placeholder="Masukkan password" required autocomplete="current-password">
      </div>

      <button type="submit" class="login-btn" id="btn-login-submit">
        <span>Masuk ke Dashboard</span>
        <span>➔</span>
      </button>
    </form>

    <!-- Demo 1-Click Login Quick Pills -->
    <div class="demo-accounts">
      <div class="demo-title">
        <span>⚡ KLIK 1-TAP UNTUK DEMO CEPAT:</span>
      </div>

      <button type="button" class="demo-pill" onclick="quickFill('owner', 'password123')">
        <div>
          <div style="font-weight: 800; color: #0f172a;">👑 Bpk. Djohan (Pemilik)</div>
          <div style="font-size: 0.74rem; color: #64748b; font-weight: 500;">Hak Akses Penuh: Admin Backoffice & Multi-Cabang</div>
        </div>
        <span class="demo-role-badge role-owner">PEMILIK</span>
      </button>

      <button type="button" class="demo-pill" onclick="quickFill('admin', 'password123')">
        <div>
          <div style="font-weight: 800; color: #0f172a;">⚡ Super Admin Resto</div>
          <div style="font-size: 0.74rem; color: #64748b; font-weight: 500;">Hak Akses Backoffice & Kelola Sistem Pusat</div>
        </div>
        <span class="demo-role-badge" style="background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1;">ADMIN</span>
      </button>

      <button type="button" class="demo-pill" onclick="quickFill('senopati', 'password123')">
        <div>
          <div style="font-weight: 800; color: #0f172a;">👔 Dimas (Manager Gerai)</div>
          <div style="font-size: 0.74rem; color: #64748b; font-weight: 500;">Operasional Kasir & KDS Cabang Senopati</div>
        </div>
        <span class="demo-role-badge role-branch">MANAGER</span>
      </button>

      <button type="button" class="demo-pill" onclick="quickFill('kasir', 'password123')">
        <div>
          <div style="font-weight: 800; color: #0f172a;">💻 Siti (Kasir Resto)</div>
          <div style="font-size: 0.74rem; color: #64748b; font-weight: 500;">Layar POS Kasir, Cetak Struk & Pembayaran</div>
        </div>
        <span class="demo-role-badge" style="background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0;">KASIR</span>
      </button>
    </div>
  </div>

  <!-- Custom Partner / Developer Card Footer (CV. ISTANA BARCODE COMPUTER) -->
  <div class="powered-card">
    <div class="pc-icon-box">
      <!-- Amber QR Code Barcode vector icon -->
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
        <circle cx="6.5" cy="6.5" r="1" fill="#d97706" />
        <circle cx="17.5" cy="6.5" r="1" fill="#d97706" />
        <circle cx="6.5" cy="17.5" r="1" fill="#d97706" />
        <path d="M14 14h3v3h-3z" />
        <path d="M20 14v4" />
        <path d="M14 20h6" />
      </svg>
    </div>
    <div class="pc-content">
      <div class="pc-top">
        <span class="pc-powered-label">POWERED BY</span>
        <span class="pc-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="m9 12 2 2 4-4" />
          </svg>
          Developer Cerdas
        </span>
      </div>
      <div class="pc-company">CV. ISTANA BARCODE COMPUTER</div>
      <div class="pc-tags">
        <span>Barcode</span>
        <span class="pc-dot">•</span>
        <span>POS</span>
        <span class="pc-dot">•</span>
        <span>Komputer</span>
        <span class="pc-dot">•</span>
        <span>Software</span>
        <span class="pc-dot">•</span>
        <span>Smart Digital CCTV</span>
      </div>
    </div>
  </div>

  <a href="/" class="back-home">← Kembali ke Portal Utama ScanDine</a>
</div>

<script>
function quickFill(user, pass) {
  document.getElementById('username').value = user;
  document.getElementById('password').value = pass;
  document.getElementById('btn-login-submit').click();
}

async function handleLogin(e) {
  e.preventDefault();
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn-login-submit');

  btn.disabled = true;
  btn.innerText = "Memverifikasi...";

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();
    if (!res.ok) {
      errBox.innerText = data.error || "Gagal masuk. Periksa username dan password.";
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = `<span>Masuk ke Dashboard</span><span>➔</span>`;
      return;
    }

    // Save session
    localStorage.setItem('scandine_user', JSON.stringify(data.user));

    // Redirect based on role rules:
    // Only OWNER and ADMIN are routed to /admin backoffice!
    // GERAI_MANAGER, CASHIER, and WAITER are routed to /pos operational screen!
    const urlParams = new URLSearchParams(window.location.search);
    let target = urlParams.get('redirect');
    const isOwnerOrAdmin = data.user.role === 'OWNER' || data.user.role === 'ADMIN';

    if (!target || target === '/admin' || target.startsWith('/admin')) {
      if (isOwnerOrAdmin) {
        target = '/admin';
      } else {
        const outletSlug = data.user.assignedOutlet ? data.user.assignedOutlet.slug : 'senopati';
        target = `/pos?outlet=${outletSlug}`;
      }
    } else if (!isOwnerOrAdmin && (target === '/admin' || target.startsWith('/admin'))) {
      const outletSlug = data.user.assignedOutlet ? data.user.assignedOutlet.slug : 'senopati';
      target = `/pos?outlet=${outletSlug}`;
    } else if (data.user.assignedOutlet && !target.includes('outlet=')) {
      const sep = target.includes('?') ? '&' : '?';
      target = `${target}${sep}outlet=${data.user.assignedOutlet.slug}`;
    }

    window.location.href = target;
  } catch (err) {
    errBox.innerText = "Koneksi bermasalah ke server.";
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = `<span>Masuk ke Dashboard</span><span>➔</span>`;
  }
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
