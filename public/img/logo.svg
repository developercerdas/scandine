<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 68" width="264" height="68">
  <defs>
    <linearGradient id="scandineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon (60x60 centered vertically at y=4) -->
  <g transform="translate(2, 4)">
    <rect width="60" height="60" rx="16" fill="url(#scandineGrad)" />
    <!-- Outer QR Target Corners -->
    <path d="M14 24 V16 H22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46 24 V16 H38" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 36 V44 H22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46 36 V44 H38" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center Cloche / Food Bell -->
    <path d="M20 34 C20 25 40 25 40 34 Z" fill="url(#accentGrad)" />
    <circle cx="30" cy="25" r="2.5" fill="#ffffff" />
    <path d="M18 35 H42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- QR Data Matrix Dots -->
    <rect x="23" y="39" width="4" height="4" rx="1" fill="#ffffff" />
    <rect x="33" y="39" width="4" height="4" rx="1" fill="#ffffff" />
  </g>

  <!-- Typography: ScanDine -->
  <text x="74" y="40" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="-1">
    <tspan fill="#0f172a">Scan</tspan><tspan fill="#0284c7">Dine</tspan>
  </text>

  <!-- Accent Dot -->
  <circle cx="248" cy="21" r="4" fill="#f59e0b" />

  <!-- Subtitle Tagline -->
  <text x="76" y="57" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" fill="#64748b" letter-spacing="1.8">
    SMART QR DINE-IN &amp; POS
  </text>
</svg>
