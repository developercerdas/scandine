<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanDine - Kitchen Display System & POS</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --kds-bg: #090d16;
      --kds-card-bg: #111827;
      --kds-card-border: #1f2937;
      --kds-text: #f9fafb;
      --kds-muted: #9ca3af;
      --kds-accent: #38bdf8;
      --kds-green: #10b981;
      --kds-amber: #f59e0b;
      --kds-red: #ef4444;
    }

    body {
      background-color: var(--kds-bg);
      color: var(--kds-text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* KDS Top Bar */
    .kds-navbar {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .kds-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .kds-logo {
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }

    .kds-badge-live {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .kds-pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    /* Chef All-Day Aggregator Strip (Rekap Porsi Masak) */
    .all-day-bar {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .all-day-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .all-day-pill {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #e2e8f0;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .all-day-qty {
      background: #38bdf8;
      color: #0f172a;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Sub Toolbar & View Switcher */
    .kds-toolbar {
      padding: 16px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .kds-tabs {
      display: flex;
      background: #1e293b;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .kds-tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .kds-tab-btn.active {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
    }

    .channel-pill-group {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .ch-btn {
      background: #111827;
      border: 1px solid #374151;
      color: #d1d5db;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .ch-btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    /* KDS Kanban / Ticket Cards Grid */
    .kds-content {
      padding: 16px 20px 40px;
    }

    .kds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    /* Ultra-Modern Ticket Card */
    .kds-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .kds-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(0,0,0,0.7);
    }

    /* Card Top Header */
    .kds-card-head {
      padding: 14px 16px;
      background: #1a2234;
      border-bottom: 1px solid #283548;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .kds-card-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .kds-timer-badge {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .timer-fresh {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .timer-warning {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .timer-urgent {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.5);
      animation: pulseUrgent 1.5s infinite;
    }

    @keyframes pulseUrgent {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Channel Tag */
    .kds-channel-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .tag-dinein { background: #0369a1; color: #fff; }
    .tag-gofood { background: #15803d; color: #fff; }
    .tag-grabfood { background: #047857; color: #fff; }
    .tag-shopeefood { background: #c2410c; color: #fff; }
    .tag-pickup { background: #6b21a8; color: #fff; }

    /* Card Items List */
    .kds-card-items {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }

    .kds-item-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 10px;
      background: #182234;
      border: 1px solid #222f46;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .kds-item-row:hover {
      background: #1e2c44;
    }

    .kds-item-row.done {
      opacity: 0.4;
      background: #0f172a;
      border-color: #1e293b;
    }

    .kds-item-row.done .kds-item-title {
      text-decoration: line-through;
      color: #64748b;
    }

    .kds-item-qty {
      background: #38bdf8;
      color: #0f172a;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .kds-item-info {
      flex: 1;
    }

    .kds-item-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .kds-item-options {
      font-size: 0.78rem;
      color: #93c5fd;
      margin-top: 2px;
    }

    .kds-item-notes {
      font-size: 0.78rem;
      color: #fbbf24;
      font-weight: 600;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Card Footer / Bump Bar Buttons */
    .kds-card-footer {
      padding: 14px 16px;
      background: #141d2d;
      border-top: 1px solid #1f2b3e;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }

    .btn-bump {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-bump-cook {
      background: #f59e0b;
      color: #0f172a;
    }
    .btn-bump-cook:hover { background: #d97706; }

    .btn-bump-ready {
      background: #10b981;
      color: #0f172a;
    }
    .btn-bump-ready:hover { background: #059669; }

    .btn-bump-done {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-bump-done:hover { background: #0284c7; color: #fff; }

    .btn-bump-print {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
    }
    .btn-bump-print:hover { background: #475569; }

    /* Floor Plan Grid in Dark Mode */
    .kds-table-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .kds-table-card {
      background: #111827;
      border: 2px solid #1f2937;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
    }

    .kds-table-card.available {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.05);
    }

    .kds-table-card.occupied {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.07);
    }

    /* Mobile & Tablet Responsive Design */
    @media (max-width: 768px) {
      .kds-navbar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 12px 14px;
      }
      .kds-brand {
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
      }
      .kds-navbar > div:last-child {
        display: flex;
        flex-wrap: wrap;
        width: 100%;
        gap: 8px;
      }
      .kds-navbar > div:last-child > * {
        flex: 1;
        min-height: 40px;
        text-align: center;
        justify-content: center;
      }
      .all-day-bar {
        padding: 10px 14px;
        -webkit-overflow-scrolling: touch;
      }
      .kds-toolbar {
        padding: 12px 14px 6px;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .kds-tabs {
        width: 100%;
      }
      .kds-tab-btn {
        flex: 1;
        justify-content: center;
        padding: 8px 10px;
        font-size: 0.8rem;
        min-height: 40px;
      }
      .channel-pill-group {
        width: 100%;
        padding-bottom: 4px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .kds-content {
        padding: 12px 14px 30px;
      }
      .kds-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .kds-table-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .kds-table-card {
        padding: 12px;
        min-height: 110px;
      }
      .btn-bump {
        min-height: 44px;
        touch-action: manipulation;
      }
    }

    @media (max-width: 480px) {
      .kds-table-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
    }
  </style>
</head>
<body>

<!-- KDS Top Navigation -->
<header class="kds-navbar">
  <div class="kds-brand">
    <div class="kds-logo">
      <span>🔥</span>
      <span>SCANDINE KDS</span>
    </div>
    <div class="kds-badge-live">
      <div class="kds-pulse-dot"></div>
      <span>KITCHEN DISPLAY LIVE</span>
    </div>

    <!-- Outlet Switcher -->
    <select id="outlet-dropdown" onchange="changeOutlet(this.value)" style="background: #1e293b; color: #fff; border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 0.82rem; cursor: pointer;">
      <option value="senopati">📍 Cabang Senopati (Pusat)</option>
      <option value="kemang">📍 Cabang Kemang Raya</option>
    </select>
  </div>

  <div style="display: flex; align-items: center; gap: 10px;">
    <button class="sound-toggle-btn" id="btn-sound" onclick="toggleAudio()" style="background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 7px 14px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; cursor: pointer;">
      🔊 Bel Koki: Aktif
    </button>
    <button onclick="openOjolModal()" style="background: #f59e0b; color: #0f172a; border: none; padding: 7px 14px; border-radius: 8px; font-weight: 900; font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 6px;">
      🛵 + Tes Order Ojol Masuk
    </button>
    <a href="/admin" target="_blank" style="text-decoration: none; background: #334155; color: #fff; padding: 7px 14px; border-radius: 8px; font-weight: 700; font-size: 0.82rem;">
      ⚙️ Backoffice
    </a>
  </div>
</header>

<!-- Chef's "All-Day" Item Aggregator (Rekap Total Masak Saat Ini) -->
<div class="all-day-bar" id="all-day-bar">
  <div class="all-day-label">
    <span>👨‍🍳 TOTAL PORSI MASAK:</span>
  </div>
  <div id="all-day-items-list" style="display: flex; gap: 8px;">
    <!-- Rendered by JS: e.g. [3x] Nasi Goreng Wagyu, [2x] Ayam Bakar -->
  </div>
</div>

<!-- Toolbar & Filters -->
<div class="kds-toolbar">
  <div class="kds-tabs">
    <button class="kds-tab-btn active" id="tab-btn-orders" onclick="switchView('ORDERS')">
      📋 Tiket Pesanan (<span id="total-tickets-count">0</span>)
    </button>
    <button class="kds-tab-btn" id="tab-btn-tables" onclick="switchView('TABLES')">
      🪑 Denah Meja Resto (<span id="total-tables-count">0</span>)
    </button>
  </div>

  <!-- Channel Filters -->
  <div class="channel-pill-group" id="channel-pill-group">
    <button class="ch-btn active" onclick="filterChannel('ALL', this)">Semua Channel</button>
    <button class="ch-btn" onclick="filterChannel('DINE_IN', this)">🍽️ Dine-In Meja</button>
    <button class="ch-btn" onclick="filterChannel('GOFOOD', this)">🟢 GoFood</button>
    <button class="ch-btn" onclick="filterChannel('GRABFOOD', this)">🟢 GrabFood</button>
    <button class="ch-btn" onclick="filterChannel('SHOPEEFOOD', this)">🟠 ShopeeFood</button>
    <button class="ch-btn" onclick="filterChannel('PICK_UP', this)">🛍️ Pick-Up</button>
  </div>
</div>

<!-- Main KDS Content Area -->
<main class="kds-content">
  <!-- VIEW 1: ORDERS KANBAN / GRID -->
  <div id="view-orders-section">
    <div class="kds-grid" id="kds-tickets-grid">
      <!-- Cards rendered by JS -->
    </div>
  </div>

  <!-- VIEW 2: TABLES FLOOR PLAN -->
  <div id="view-tables-section" style="display: none;">
    <div class="kds-table-grid" id="kds-tables-grid">
      <!-- Tables rendered by JS -->
    </div>
  </div>
</main>

<!-- Ojol Modal -->
<div class="drawer-backdrop" id="ojol-backdrop" onclick="closeOjolModal()"></div>
<div class="drawer-content" id="ojol-drawer" style="max-height: 480px; background: #111827; color: #fff;">
  <div class="drawer-header" style="border-color: #1f2937;">
    <h3 class="drawer-title" style="color: #fff;">🛵 Simulasi Pesanan Ojol Masuk</h3>
    <button class="drawer-close" style="background: #1f2937; color: #fff;" onclick="closeOjolModal()">✕</button>
  </div>
  <div class="drawer-body">
    <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 16px;">
      Klik salah satu tombol untuk melihat pesanan online masuk ke layar dapur secara instan:
    </p>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
      <button onclick="triggerDeliveryWebhook('gofood')" style="padding: 14px 10px; background: #15803d; color: #fff; border: none; border-radius: 12px; font-weight: 800; cursor: pointer;">
        🟢 GoFood
      </button>
      <button onclick="triggerDeliveryWebhook('grabfood')" style="padding: 14px 10px; background: #047857; color: #fff; border: none; border-radius: 12px; font-weight: 800; cursor: pointer;">
        🟢 GrabFood
      </button>
      <button onclick="triggerDeliveryWebhook('shopeefood')" style="padding: 14px 10px; background: #c2410c; color: #fff; border: none; border-radius: 12px; font-weight: 800; cursor: pointer;">
        🟠 ShopeeFood
      </button>
    </div>
  </div>
</div>

<!-- Hidden Thermal Print Area -->
<div id="thermal-receipt-area"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// State
const urlParams = new URLSearchParams(window.location.search);
let currentOutletSlug = urlParams.get('outlet') || 'senopati';
let currentOutletId = 'outlet-senopati';
let currentChannel = 'ALL';
let currentView = 'ORDERS';
let orders = [];
let tables = [];
let audioEnabled = true;

const socket = io();

function joinSocketBranch(slug) {
  currentOutletId = slug === 'kemang' ? 'outlet-kemang' : 'outlet-senopati';
  socket.emit('join_staff', currentOutletId);
}
joinSocketBranch(currentOutletSlug);

// Audio Chime
function playOrderChime() {
  if (!audioEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();

    osc1.type = 'triangle';
    osc2.type = 'sine';
    osc1.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
    osc2.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12); // E5

    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);
    osc1.start();
    osc2.start();
    osc1.stop(ctx.currentTime + 0.9);
    osc2.stop(ctx.currentTime + 0.9);
  } catch (e) {}
}

function toggleAudio() {
  audioEnabled = !audioEnabled;
  document.getElementById('btn-sound').innerText = audioEnabled ? "🔊 Bel Koki: Aktif" : "🔇 Bel: Mati";
  if (audioEnabled) playOrderChime();
}

function formatRupiah(amount) {
  return "Rp " + (amount || 0).toLocaleString('id-ID');
}

// Elapsed timer calculation (Minutes:Seconds)
function getElapsedFormatted(isoCreatedAt) {
  if (!isoCreatedAt) return "00:00";
  const diffSec = Math.max(0, Math.floor((Date.now() - new Date(isoCreatedAt).getTime()) / 1000));
  const m = Math.floor(diffSec / 60);
  const s = diffSec % 60;
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function getTimerClass(isoCreatedAt) {
  if (!isoCreatedAt) return "timer-fresh";
  const diffMin = Math.floor((Date.now() - new Date(isoCreatedAt).getTime()) / 60000);
  if (diffMin >= 15) return "timer-urgent";
  if (diffMin >= 8) return "timer-warning";
  return "timer-fresh";
}

function changeOutlet(slug) {
  currentOutletSlug = slug;
  joinSocketBranch(slug);
  fetchOrders();
  fetchTables();
}

// -----------------------------------------------------------------------------
// LOAD DATA
// -----------------------------------------------------------------------------
async function fetchOrders() {
  try {
    const res = await fetch(`/api/staff/orders?outlet=${encodeURIComponent(currentOutletSlug)}`);
    orders = await res.json();
    renderKdsTickets();
    renderAllDayCookCount();
  } catch (e) {}
}

async function fetchTables() {
  try {
    const res = await fetch(`/api/staff/tables?outlet=${encodeURIComponent(currentOutletSlug)}`);
    const data = await res.json();
    tables = data.tables || [];
    document.getElementById('total-tables-count').innerText = tables.length;
    renderKdsTables();
  } catch (e) {}
}

// Socket Realtime
socket.on('new_order', (newOrder) => {
  if (newOrder.outletId === currentOutletId) {
    const idx = orders.findIndex(o => o.id === newOrder.id);
    if (idx !== -1) orders[idx] = newOrder;
    else {
      orders.unshift(newOrder);
      playOrderChime();
    }
    renderKdsTickets();
    renderAllDayCookCount();
    fetchTables();
  }
});

socket.on('order_updated', (updatedOrder) => {
  if (updatedOrder.outletId === currentOutletId) {
    const idx = orders.findIndex(o => o.id === updatedOrder.id);
    if (idx !== -1) orders[idx] = updatedOrder;
    renderKdsTickets();
    renderAllDayCookCount();
    fetchTables();
  }
});

socket.on('tables_updated', () => {
  fetchTables();
});

// View switcher
function switchView(mode) {
  currentView = mode;
  document.getElementById('tab-btn-orders').classList.toggle('active', mode === 'ORDERS');
  document.getElementById('tab-btn-tables').classList.toggle('active', mode === 'TABLES');
  document.getElementById('view-orders-section').style.display = mode === 'ORDERS' ? 'block' : 'none';
  document.getElementById('view-tables-section').style.display = mode === 'TABLES' ? 'block' : 'none';
  document.getElementById('channel-pill-group').style.display = mode === 'ORDERS' ? 'flex' : 'none';
  document.getElementById('all-day-bar').style.display = mode === 'ORDERS' ? 'flex' : 'none';

  if (mode === 'TABLES') fetchTables();
}

function filterChannel(ch, el) {
  currentChannel = ch;
  document.querySelectorAll('.channel-pill-group .ch-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  renderKdsTickets();
}

// -----------------------------------------------------------------------------
// CHEF'S ALL-DAY COOK COUNT AGGREGATOR
// -----------------------------------------------------------------------------
function renderAllDayCookCount() {
  const container = document.getElementById('all-day-items-list');
  // Aggregate items from pending tickets (RECEIVED or COOKING)
  const activeTickets = orders.filter(o => o.orderStatus === 'RECEIVED' || o.orderStatus === 'COOKING');
  
  const countMap = {};
  activeTickets.forEach(o => {
    (o.items || []).forEach(it => {
      countMap[it.name] = (countMap[it.name] || 0) + (it.qty || 1);
    });
  });

  const entries = Object.entries(countMap);
  if (entries.length === 0) {
    container.innerHTML = `<span style="font-size: 0.8rem; color: #64748b;">Semua pesanan selesai dimasak ✨</span>`;
    return;
  }

  container.innerHTML = entries.map(([name, qty]) => `
    <div class="all-day-pill">
      <span class="all-day-qty">${qty}x</span>
      <span>${name}</span>
    </div>
  `).join('');
}

// -----------------------------------------------------------------------------
// RENDER KDS TICKETS
// -----------------------------------------------------------------------------
function renderKdsTickets() {
  const grid = document.getElementById('kds-tickets-grid');
  let list = orders;

  if (currentChannel !== 'ALL') {
    list = list.filter(o => o.channel === currentChannel);
  }

  // Active tickets first
  list = list.filter(o => o.orderStatus !== 'COMPLETED');
  document.getElementById('total-tickets-count').innerText = list.length;

  if (list.length === 0) {
    grid.innerHTML = `
      <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; background: #111827; border-radius: 16px; border: 1px dashed #374151;">
        <div style="font-size: 3rem; margin-bottom: 8px;">👨‍🍳</div>
        <h3 style="font-size: 1.25rem; font-weight: 800; color: #fff;">Antrean Dapur Bersih</h3>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 4px;">Tidak ada pesanan aktif. Pesanan baru dari meja atau ojol akan otomatis muncul dengan suara bell.</p>
      </div>
    `;
    return;
  }

  let html = "";
  list.forEach((order, index) => {
    // Channel styling
    let channelTagClass = "tag-dinein";
    let channelTitle = `🍽️ MEJA ${order.tableNumber.replace(/\D/g, '') || '01'}`;
    if (order.channel === 'GOFOOD') {
      channelTagClass = "tag-gofood";
      channelTitle = `🟢 GOFOOD #${order.externalOrderId || ''}`;
    } else if (order.channel === 'GRABFOOD') {
      channelTagClass = "tag-grabfood";
      channelTitle = `🟢 GRABFOOD #${order.externalOrderId || ''}`;
    } else if (order.channel === 'SHOPEEFOOD') {
      channelTagClass = "tag-shopeefood";
      channelTitle = `🟠 SHOPEEFOOD #${order.externalOrderId || ''}`;
    } else if (order.channel === 'PICK_UP') {
      channelTagClass = "tag-pickup";
      channelTitle = `🛍️ PICK-UP (${order.pickupTime || 'Segera'})`;
    }

    const timerClass = getTimerClass(order.createdAt);
    const elapsedText = getElapsedFormatted(order.createdAt);

    // Items list with interactive strike-through
    let itemsHtml = "";
    (order.items || []).forEach((it, itIdx) => {
      const opts = (it.options || []).map(o => o.value).join(', ');
      itemsHtml += `
        <div class="kds-item-row" id="item-${order.id}-${itIdx}" onclick="toggleItemStrike('item-${order.id}-${itIdx}')">
          <span class="kds-item-qty">${it.qty}x</span>
          <div class="kds-item-info">
            <div class="kds-item-title">${it.name}</div>
            ${opts ? `<div class="kds-item-options">${opts}</div>` : ''}
            ${it.notes ? `<div class="kds-item-notes">📝 ${it.notes}</div>` : ''}
          </div>
        </div>
      `;
    });

    // Action Bump Bar Button
    let bumpBtnHtml = "";
    if (order.orderStatus === 'RECEIVED') {
      bumpBtnHtml = `
        <button class="btn-bump btn-bump-cook" onclick="updateOrderStatus('${order.id}', 'COOKING')">
          🍳 Mulai Masak
        </button>
      `;
    } else if (order.orderStatus === 'COOKING') {
      bumpBtnHtml = `
        <button class="btn-bump btn-bump-ready" onclick="updateOrderStatus('${order.id}', 'READY')">
          🔔 Makanan Siap
        </button>
      `;
    } else if (order.orderStatus === 'READY') {
      bumpBtnHtml = `
        <button class="btn-bump btn-bump-done" onclick="updateOrderStatus('${order.id}', 'COMPLETED')">
          ✅ Selesai Diantar
        </button>
      `;
    }

    html += `
      <div class="kds-card">
        <div class="kds-card-head">
          <div>
            <div class="kds-card-title">${channelTitle}</div>
            <div class="kds-channel-tag ${channelTagClass}">#${order.id.slice(-4)} • ${order.customerName}</div>
            ${order.driverInfo ? `
              <div style="font-size: 0.75rem; color: #34d399; font-weight: 800; margin-top: 4px;">
                PIN Driver: ${order.driverInfo.pin}
              </div>
            ` : ''}
          </div>
          <div>
            <div class="kds-timer-badge ${timerClass}">
              ⏱️ ${elapsedText}
            </div>
          </div>
        </div>

        <div class="kds-card-items">
          ${itemsHtml}
        </div>

        <div class="kds-card-footer">
          ${bumpBtnHtml}
          <button class="btn-bump btn-bump-print" onclick="printReceipt('${order.id}')">
            🖨️ Tiket
          </button>
        </div>
      </div>
    `;
  });

  grid.innerHTML = html;
}

// Toggle strike-through for items (Koki check-off)
function toggleItemStrike(elId) {
  const el = document.getElementById(elId);
  if (el) el.classList.toggle('done');
}

// -----------------------------------------------------------------------------
// RENDER TABLES (FLOOR PLAN)
// -----------------------------------------------------------------------------
function renderKdsTables() {
  const grid = document.getElementById('kds-tables-grid');
  let html = "";

  tables.forEach(tbl => {
    let statusClass = "available";
    let statusLabel = "Kosong (Tersedia)";
    let badgeColor = "#34d399";
    let bgBadge = "rgba(16, 185, 129, 0.2)";

    if (tbl.status === 'OCCUPIED') {
      statusClass = "occupied";
      statusLabel = `Terisi (${tbl.durationMinutes || 0} mnt)`;
      badgeColor = "#fbbf24";
      bgBadge = "rgba(245, 158, 11, 0.2)";
    }

    html += `
      <div class="kds-table-card ${statusClass}">
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 1.35rem; font-weight: 900; color: #fff;">
              ${tbl.name}
            </span>
            <span style="font-size: 0.72rem; color: #94a3b8;">${tbl.capacity || 4} Kursi</span>
          </div>
          <div>
            <span style="background: ${bgBadge}; color: ${badgeColor}; padding: 3px 10px; border-radius: 9999px; font-size: 0.72rem; font-weight: 800;">
              ● ${statusLabel}
            </span>
          </div>
        </div>

        <div style="margin-top: 16px;">
          ${tbl.status === 'OCCUPIED' ? `
            <button onclick="clearTable('${tbl.id}')" style="width: 100%; padding: 8px; background: #1e293b; color: #f87171; border: 1px solid #334155; border-radius: 8px; font-size: 0.78rem; font-weight: 800; cursor: pointer;">
              🧹 Meja Selesai & Bersihkan
            </button>
          ` : `
            <a href="/order?outlet=${currentOutletSlug}&table=${tbl.number}" target="_blank" style="display: block; text-align: center; text-decoration: none; padding: 8px; background: #1e293b; color: #38bdf8; border: 1px solid #334155; border-radius: 8px; font-size: 0.78rem; font-weight: 800;">
              📱 Buka Menu Meja Ini
            </a>
          `}
        </div>
      </div>
    `;
  });

  grid.innerHTML = html;
}

async function clearTable(tableId) {
  if (!confirm("Tandai meja ini sudah kosong dan bersih untuk tamu baru?")) return;
  try {
    await fetch(`/api/staff/tables/${tableId}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'AVAILABLE', outletId: currentOutletId })
    });
    fetchTables();
  } catch (e) {}
}

// -----------------------------------------------------------------------------
// STATUS UPDATES
// -----------------------------------------------------------------------------
async function updateOrderStatus(orderId, nextStatus) {
  try {
    const res = await fetch(`/api/staff/orders/${orderId}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderStatus: nextStatus })
    });
    const data = await res.json();
    if (data.success) {
      const idx = orders.findIndex(o => o.id === orderId);
      if (idx !== -1) orders[idx] = data.order;
      renderKdsTickets();
      renderAllDayCookCount();
    }
  } catch (e) {}
}

// -----------------------------------------------------------------------------
// OJOL SIMULATION WEBHOOK
// -----------------------------------------------------------------------------
function openOjolModal() {
  document.getElementById('ojol-backdrop').classList.add('active');
  document.getElementById('ojol-drawer').classList.add('active');
}

function closeOjolModal() {
  document.getElementById('ojol-backdrop').classList.remove('active');
  document.getElementById('ojol-drawer').classList.remove('active');
}

async function triggerDeliveryWebhook(channel) {
  closeOjolModal();
  const sampleItems = [
    { name: "Nasi Goreng Wagyu Selera", price: 58000, qty: 2, notes: "Pedas Sedang" },
    { name: "Es Kopi Susu Gula Aren", price: 24000, qty: 1, notes: "Normal Sweet" }
  ];

  try {
    const res = await fetch(`/api/webhooks/${channel}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        outletId: currentOutletId,
        customerName: "Siti Rahma (Online " + channel.toUpperCase() + ")",
        driverName: "Pak Slamet",
        driverPhone: "0813-8899-0011",
        driverPin: Math.floor(1000 + Math.random() * 9000).toString(),
        items: sampleItems,
        total: 140000
      })
    });
    const data = await res.json();
    if (data.success) {
      fetchOrders();
    }
  } catch (e) {}
}

let storeProfile = {};

async function fetchStoreProfile() {
  try {
    const res = await fetch(`/api/admin/store-profile?outlet=${currentOutlet}`);
    storeProfile = await res.json();
    if (storeProfile.businessName) {
      document.title = `${storeProfile.businessName} - KDS & POS`;
    }
  } catch (err) {
    console.error("Gagal load profile toko:", err);
  }
}

// -----------------------------------------------------------------------------
// PRINT RECEIPT / STRUK (Ukuran Standar Thermal 58mm)
// -----------------------------------------------------------------------------
function printReceipt(orderId) {
  const order = orders.find(o => o.id === orderId);
  if (!order) return;

  const area = document.getElementById('thermal-receipt-area');
  let itemsRows = "";
  order.items.forEach(it => {
    itemsRows += `
      <div style="display: flex; justify-content: space-between; margin-bottom: 3px;">
        <span style="font-weight: 600;">${it.qty}x ${it.name}</span>
        <span>${formatRupiah(it.subtotal)}</span>
      </div>
      ${it.options && it.options.length ? `<div style="font-size: 9px; color: #555; padding-left: 10px;">${it.options.map(o => o.value).join(', ')}</div>` : ''}
      ${it.notes ? `<div style="font-size: 9px; font-style: italic; color: #555; padding-left: 10px;">* ${it.notes}</div>` : ''}
    `;
  });

  const bizName = order.businessName || storeProfile.businessName || "KOPI & SELERA NUSANTARA";
  const outletName = order.outletName || storeProfile.outletName || "Cabang Senopati";
  const address = order.outletAddress || storeProfile.address || "";
  const phone = order.outletPhone || storeProfile.phone || "";
  const footerText = order.receiptFooter || storeProfile.receiptFooter || "Terima kasih atas kunjungan Anda!\nSilakan datang kembali.";
  const orderDate = new Date(order.createdAt).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });

  area.innerHTML = `
    <div style="text-align: center; padding-bottom: 6px; border-bottom: 1px dashed #000; margin-bottom: 6px;">
      <h3 style="font-size: 14px; margin: 0; font-weight: 900; letter-spacing: 0.5px;">${bizName.toUpperCase()}</h3>
      <div style="font-size: 10px; font-weight: bold; margin-top: 2px;">${outletName}</div>
      ${address ? `<div style="font-size: 9px; margin-top: 2px; color: #333;">${address}</div>` : ''}
      ${phone ? `<div style="font-size: 9px; color: #333;">Telp: ${phone}</div>` : ''}
    </div>

    <div style="margin-bottom: 6px; font-size: 10px; line-height: 1.4;">
      <div style="display: flex; justify-content: space-between;">
        <span>No: <strong>${order.id}</strong></span>
        <span>${orderDate}</span>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span>Lokasi: <strong>${order.tableNumber}</strong></span>
        <span>${order.customerName}</span>
      </div>
      <div style="font-weight: bold; margin-top: 2px;">
        Kanal: ${order.channel} ${order.driverInfo ? `(Driver: ${order.driverInfo.name} • PIN: ${order.driverInfo.pin})` : ''}
      </div>
    </div>

    <div style="border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 6px 0; margin-bottom: 6px; font-size: 10px;">
      ${itemsRows}
    </div>

    <div style="font-size: 10px; line-height: 1.4; margin-bottom: 8px;">
      <div style="display: flex; justify-content: space-between;">
        <span>Subtotal:</span>
        <span>${formatRupiah(order.subtotal)}</span>
      </div>
      ${order.tax ? `
      <div style="display: flex; justify-content: space-between;">
        <span>PB1 / Resto Tax (${storeProfile.taxRate || 10}%):</span>
        <span>${formatRupiah(order.tax)}</span>
      </div>` : ''}
      ${order.service ? `
      <div style="display: flex; justify-content: space-between;">
        <span>Service Charge (${storeProfile.serviceRate || 5}%):</span>
        <span>${formatRupiah(order.service)}</span>
      </div>` : ''}
      <div style="display: flex; justify-content: space-between; font-weight: 900; font-size: 12px; margin-top: 4px; padding-top: 4px; border-top: 1px solid #000;">
        <span>TOTAL:</span>
        <span>${formatRupiah(order.total)}</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 9px; margin-top: 4px;">
        <span>Pembayaran:</span>
        <span><strong>${order.paymentMethod} (${order.paymentStatus === 'PAID' ? 'LUNAS' : 'MENUNGGU'})</strong></span>
      </div>
    </div>

    <div style="text-align: center; font-size: 9px; border-top: 1px dashed #000; padding-top: 6px; white-space: pre-line; color: #333;">
      ${footerText}
    </div>
  `;

  window.print();
}

// Live timer tick every second for kitchen cards
setInterval(() => {
  document.querySelectorAll('.kds-card').forEach((card, idx) => {
    const o = orders.filter(x => x.orderStatus !== 'COMPLETED')[idx];
    if (o) {
      const timerBadge = card.querySelector('.kds-timer-badge');
      if (timerBadge) {
        timerBadge.innerText = `⏱️ ${getElapsedFormatted(o.createdAt)}`;
        timerBadge.className = `kds-timer-badge ${getTimerClass(o.createdAt)}`;
      }
    }
  });
}, 1000);

// Init
fetchStoreProfile();
fetchOrders();
fetchTables();
setInterval(fetchOrders, 8000);
</script>
